<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>soralutik.Jash - Link Saya</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="profile-header">
        <img
          src="URL_GAMBAR_PROFIL_ANDA"
          alt="Foto Profil"
          class="profile-pic"
        />
        <h1 class="username">soralutik.Jash</h1>
      </header>

      <main class="link-list">
        <a href="URL_LINK_BOOKING_POLICY" class="link-item" target="_blank">
          <i class="fas fa-file-alt icon"></i>
          <span class="text">Booking Policy</span>
          <span class="subtext">Document</span>
          <i class="fas fa-ellipsis-v menu-icon"></i>
        </a>

        <a href="URL_LINK_WHATSAPP" class="link-item" target="_blank">
          <i class="fab fa-whatsapp icon"></i>
          <span class="text">WhatsApp</span>
          <i class="fas fa-ellipsis-v menu-icon"></i>
        </a>

        <a href="URL_LINK_INSTAGRAM" class="link-item" target="_blank">
          <i class="fab fa-instagram icon"></i>
          <span class="text">Instagram</span>
          <i class="fas fa-ellipsis-v menu-icon"></i>
        </a>

        <a href="URL_LINK_LOKASI" class="link-item" target="_blank">
          <i class="fas fa-map-marker-alt icon"></i>
          <span class="text">Location</span>
          <i class="fas fa-ellipsis-v menu-icon"></i>
        </a>
      </main>
    </div>
